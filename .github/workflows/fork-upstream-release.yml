# Fork-only automation. Upstream never edits this file, so syncing upstream
# commits (including changes to its own module-release.yml) cannot break it.
#
# Every hour (or on demand) this workflow:
#   1. finds upstream releases (KyuubiRan/Shellscaled) that the fork has not mirrored yet,
#   2. merges upstream main into the fork's main,
#   3. checks out each upstream release tag, builds arm64, arm (32-bit) and amd64 (x86_64)
#      packages with upstream's own scripts/build.py, builds and signs the Shellscaled app,
#      bundles it into every ZIP plus one universal ZIP, and
#   4. publishes a fork release with the same tag, title, channel and asset naming.
name: Mirror upstream release (arm64 + arm + x86_64 + universal)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to mirror (empty = every new upstream release)
        required: false
        type: string
      rebuild:
        description: Replace the fork release if this tag is already mirrored
        required: false
        type: boolean
        default: false
      sync:
        description: Merge upstream main into the fork even when nothing new was released
        required: false
        type: boolean
        default: true

concurrency:
  group: fork-upstream-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: KyuubiRan/Shellscaled
  WORKFLOW_FILE: fork-upstream-release.yml

jobs:
  plan:
    if: github.repository != 'KyuubiRan/Shellscaled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out fork automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/fork
          persist-credentials: false

      - name: Keep the schedule from being auto-disabled after 60 idle days
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/enable" || true

      - name: Find upstream releases that still need a fork release
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_REBUILD: ${{ inputs.rebuild && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--upstream "$UPSTREAM_REPO" --fork "$GITHUB_REPOSITORY")
          if [ -n "$INPUT_TAG" ]; then args+=(--tag "$INPUT_TAG"); fi
          if [ "$INPUT_REBUILD" = true ]; then args+=(--rebuild); fi
          python3 .github/fork/mirror_upstream.py plan "${args[@]}"

  sync:
    needs: plan
    if: needs.plan.outputs.count != '0' || (github.event_name == 'workflow_dispatch' && inputs.sync)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # A PAT is required: GITHUB_TOKEN cannot push commits that change workflow files.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Check out the fork's default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Merge upstream main
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          read -r login id < <(gh api user --jq '"\(.login) \(.id)"')
          git config user.name "$login"
          git config user.email "${id}+${login}@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork $BRANCH already contains upstream main $(git rev-parse --short=12 upstream/main)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-edit -m "Sync upstream main ($(git rev-parse --short=12 upstream/main))" upstream/main; then
            git merge --abort || true
            echo "::error::Upstream main conflicts with fork-only commits on $BRANCH; resolve the merge manually."
            exit 1
          fi
          git push origin "HEAD:$BRANCH"
          echo "Merged upstream main $(git rev-parse --short=12 upstream/main) into $BRANCH." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep inherited upstream workflows disabled
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active") | "\(.id) \(.path)"' |
          while read -r id path; do
            [ "$path" = ".github/workflows/$WORKFLOW_FILE" ] && continue
            if git cat-file -e "upstream/main:$path" 2>/dev/null; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"
              echo "Disabled inherited upstream workflow $path"
            fi
          done

  release:
    needs: [plan, sync]
    # Releases are built from the upstream tag itself, so they proceed even if the branch merge fails.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ matrix.tag }}
      PRERELEASE: ${{ matrix.prerelease }}
      LATEST: ${{ matrix.latest }}
      GOTOOLCHAIN: local
    steps:
      - name: Check out fork automation and the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          sparse-checkout: |
            .github/fork
            android
          persist-credentials: false

      - name: Check out the upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: refs/tags/${{ matrix.tag }}
          path: src
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Verify upstream's arm64 CLI core and pin the Tailscale source
        id: prepare
        run: |
          set -euo pipefail
          args=(--src src --tag "$TAG")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          python3 fork/.github/fork/mirror_upstream.py prepare-source "${args[@]}"

      - name: Set up the source's required Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/tailscale/go.mod
          cache: false

      - name: Select the Android NDK (upstream's pinned version when present)
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          if [ ! -d "$ndk" ]; then
            ndk=$(ls -d "$ANDROID_HOME"/ndk/*/ | sort -V | tail -n 1)
            ndk=${ndk%/}
            echo "::warning::Upstream's NDK 30.0.16248370 is missing; using $(basename "$ndk")"
          fi
          for tool in aarch64-linux-android23-clang armv7a-linux-androideabi23-clang x86_64-linux-android23-clang; do
            test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/$tool"
          done
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Build arm64 (upstream's verified core), arm and amd64 (compiled from the same source)
        working-directory: src
        env:
          REVISION: ${{ steps.prepare.outputs.revision }}
          CHANNEL: ${{ steps.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          python3 scripts/build.py --arch arm64 --package-only --revision "$REVISION" --release-channel "$CHANNEL"
          python3 scripts/build.py --arch arm --revision "$REVISION" --release-channel "$CHANNEL"
          python3 scripts/build.py --arch amd64 --revision "$REVISION" --release-channel "$CHANNEL"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for arch in ('arm64', 'arm', 'amd64'):
              info = json.loads(Path(f'.work/package/{arch}/build-info.json').read_text())
              assert info['moduleTreeDirty'] is False, arch
              assert info['moduleSourceCommit'] == head, arch
              assert info['architecture'] == arch, arch
              assert f'architecture={arch}\n' in Path(f'.work/package/{arch}/module.prop').read_text(), arch
          PY

      - name: Build, test and sign the Shellscaled app
        working-directory: fork/android
        env:
          SHELLSCALED_KEYSTORE_B64: ${{ secrets.SHELLSCALED_KEYSTORE_B64 }}
          SHELLSCALED_KEYSTORE_PASSWORD: ${{ secrets.SHELLSCALED_KEYSTORE_PASSWORD }}
          SHELLSCALED_KEY_ALIAS: ${{ secrets.SHELLSCALED_KEY_ALIAS }}
          SHELLSCALED_KEY_PASSWORD: ${{ secrets.SHELLSCALED_KEY_PASSWORD }}
          VERSION: ${{ steps.prepare.outputs.version }}
          REVISION: ${{ steps.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          if [ -z "$SHELLSCALED_KEYSTORE_B64" ]; then
            echo "::error::Missing SHELLSCALED_KEYSTORE_B64; the app must be signed with the fork's release key."
            exit 1
          fi
          export JAVA_HOME="$JAVA_HOME_21_X64"
          # `yes` dies of SIGPIPE once sdkmanager exits; judge the pipeline by sdkmanager alone.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
          set -o pipefail
          test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"
          export SHELLSCALED_KEYSTORE="$RUNNER_TEMP/shellscaled-release.jks"
          printf '%s' "$SHELLSCALED_KEYSTORE_B64" | base64 -d > "$SHELLSCALED_KEYSTORE"
          trap 'rm -f "$SHELLSCALED_KEYSTORE"' EXIT
          # The app's versionCode follows the module's, so every release upgrades cleanly.
          code=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["versionCode"])' ../../src/.work/package/arm64/build-info.json)
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PappVersionCode="$code" -PappVersionName="$VERSION-r$REVISION"
          apk=app/build/outputs/apk/release/app-release.apk
          signer=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          if [ "$signer" != "$(cat ../.github/fork/app-signing-cert.sha256)" ]; then
            echo "::error::The APK is not signed with the pinned release certificate."
            exit 1
          fi
          name="Shellscaled-$VERSION-r$REVISION.apk"
          cp "$apk" "../../src/dist/$name"
          (cd ../../src/dist && sha256sum "$name" > "$name.sha256")

      - name: Package every ZIP with the app and test the installers
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          REVISION: ${{ steps.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          apk="src/dist/Shellscaled-$VERSION-r$REVISION.apk"
          pkg() { echo "src/dist/Shellscaled-$VERSION-r$REVISION-$1.zip"; }
          for arch in arm64 arm amd64; do
            python3 fork/.github/fork/package_fork.py --src src --arch "$arch" --apk "$apk"
          done
          python3 fork/.github/fork/package_fork.py --src src --arch arm64 --arch arm --arch amd64 --name universal --apk "$apk"
          sh fork/.github/fork/test-package.sh "$(pkg arm64)" src arm64-v8a:arm64 -- armeabi-v7a x86_64
          sh fork/.github/fork/test-package.sh "$(pkg arm)" src armeabi-v7a:arm -- arm64-v8a x86_64
          sh fork/.github/fork/test-package.sh "$(pkg amd64)" src x86_64:amd64 -- arm64-v8a armeabi-v7a
          sh fork/.github/fork/test-package.sh "$(pkg universal)" src arm64-v8a:arm64 armeabi-v7a:arm x86_64:amd64 -- x86
          test -z "$(git -C src status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(p.name for p in Path('src/dist').iterdir())
          assert len(files) == 13, files
          assert len([f for f in files if f.endswith('.zip')]) == 4, files
          assert len([f for f in files if f.endswith('.apk')]) == 1, files
          print('\n'.join(files))
          PY

      - name: Compare with upstream's assets
        run: python3 fork/.github/fork/mirror_upstream.py compare --upstream "$UPSTREAM_REPO" --tag "$TAG" --dist src/dist

      - name: Write release notes from the upstream release
        id: notes
        run: python3 fork/.github/fork/mirror_upstream.py notes --upstream "$UPSTREAM_REPO" --tag "$TAG" --out notes.md

      - name: Push the upstream tag to the fork
        env:
          PUSH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          commit=$(git -C src rev-parse "refs/tags/$TAG^{commit}")
          existing=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG^{}" "refs/tags/$TAG" | tail -n 1 | cut -f 1)
          if [ -n "$existing" ]; then
            fork_commit=$(git -C src rev-parse "$existing^{commit}" 2>/dev/null || echo "$existing")
            if [ "$fork_commit" != "$commit" ]; then
              echo "::error::Fork tag $TAG points to $existing, upstream tag points to $commit"
              exit 1
            fi
            exit 0
          fi
          git -C src push "https://x-access-token:${PUSH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG:refs/tags/$TAG"

      - name: Create the release as a draft and upload both packages
        id: draft
        env:
          TITLE: ${{ steps.notes.outputs.title }}
          REBUILD: ${{ inputs.rebuild && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$REBUILD" != true ]; then
              echo "::error::Fork release $TAG already exists"
              exit 1
            fi
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          extra=()
          if [ "$PRERELEASE" = true ]; then extra+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$TITLE" --notes-file notes.md "${extra[@]}"
          echo 'created=true' >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" src/dist/*

      - name: Publish with upstream's channel and latest flags
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          elif [ "$LATEST" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '"Published " + .url' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove this run's incomplete draft
        if: failure() && steps.draft.outputs.created == 'true'
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
